<app-header></app-header>

<div class="container">
    <h1>Registro de datos</h1>
    <div class="form">
        <form action="">
            <label for="nombre">Nombre: </label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombres" [(ngModel)]="nombre">

            <label for="apellido">Apellido: </label>
            <input type="text" name="apellido" id="apellido" placeholder="Apellidos" [(ngModel)]="apellido">

            <label for="correo">Correo: </label>
            <input type="text" name="correo" id="correo" placeholder="ejemplo@mail.com" [(ngModel)]="correo">

            <label for="celular">Celular: </label>
            <input type="text" name="celular" id="celular" placeholder="999 999 999" [(ngModel)]="celular">

            <input type="submit" value="Registrar" id="enviar" [disabled]="!nombre || !apellido || !correo || !celular">
        </form>
    </div>
</div>
