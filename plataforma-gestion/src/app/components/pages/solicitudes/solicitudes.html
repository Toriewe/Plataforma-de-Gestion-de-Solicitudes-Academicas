<app-header></app-header>

<div class="container">
  <h1>Solicitudes académicas</h1>
  <div class="tabla">
    <table>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Estado</th>
        <th>Celular</th>
        <th>Acciones</th>
      </tr>
      @for (dato of datos; track dato._id) {
        <tr>
          <td>{{ dato.nombre }}</td>
          <td>{{ dato.apellido }}</td>
          <td>
            @if (dato.estado) {
              Activo
            } @else {
              Inactivo
            }
          </td>
          <td>{{ dato.celular }}</td>
          <td>
            @if (dato.estado) {
              <button id="editar" [routerLink]="['/actualizar', dato._id]">Editar</button>
              <button id="borrar" (click)="desactivar(dato._id!)">Desactivar</button>
            } @else {
              <span>Inactivo</span>
            }
          </td>
        </tr>
      }
    </table>
  </div>
</div>
